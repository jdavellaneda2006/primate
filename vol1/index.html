<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="primate">
    <img id="imagen" src="" alt="Imagen del primate">
    <div class="card-body">
      <h1 id="tituloNombre"></h1>
      <p class="subtitulo">Ficha del primate</p>

      <div class="fila">
        <span class="etiqueta">🧬 Clasificación</span>
        <span class="valor" id="clasificacion"></span>
      </div>
      <div class="fila">
        <span class="etiqueta">🎨 Color</span>
        <span class="valor" id="color"></span>
      </div>
      <div class="fila">
        <span class="etiqueta">👪 Familia</span>
        <span class="valor" id="familia"></span>
      </div>
      <div class="fila">
        <span class="etiqueta">📍 Ubicación</span>
        <span class="valor" id="ubicacion"></span>
      </div>
      <div class="fila">
        <span class="etiqueta">🌎 País</span>
        <span class="valor" id="pais"></span>
      </div>
      <div class="fila">
        <span class="etiqueta">📏 Dimensión</span>
        <span class="valor" id="dimension"></span>
      </div>
      <div class="fila">
        <span class="etiqueta">🍌 Alimentación</span>
        <span class="valor" id="alimentacion"></span>
      </div>
      <div class="fila">
        <span class="etiqueta">⚠️ En peligro</span>
        <span class="valor" id="enPeligro"></span>
      </div>
    </div>
  </div>

  <script src="INDEX.JS"></script>
</body>
</html>
